<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>2D Map Editor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #1a1a2e; color: #eee; display: flex; height: 100vh; }

  #sidebar {
    width: 280px; background: #16213e; padding: 16px; display: flex; flex-direction: column; gap: 12px;
    overflow-y: auto;
  }
  #sidebar h2 { text-align: center; color: #e94560; margin-bottom: 4px; }
  .section { background: #0f3460; border-radius: 8px; padding: 12px; }
  .section h3 { color: #e94560; margin-bottom: 8px; font-size: 14px; }
  .section label { font-size: 13px; display: block; margin-bottom: 4px; }
  .section input[type="number"] {
    width: 60px; padding: 4px; border: none; border-radius: 4px; background: #1a1a2e; color: #eee; text-align: center;
  }
  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }

  button {
    padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold;
    transition: background 0.2s;
  }
  .btn-mode { background: #533483; color: #fff; width: 100%; }
  .btn-mode:hover { background: #6a42a0; }
  .btn-mode.active { background: #e94560; }
  .btn-action { background: #0f3460; color: #fff; width: 100%; }
  .btn-action:hover { background: #1a4a8a; }
  .btn-danger { background: #a03030; color: #fff; width: 100%; }
  .btn-danger:hover { background: #c04040; }
  .btn-export { background: #1b998b; color: #fff; width: 100%; }
  .btn-export:hover { background: #24c4b2; }

  #obstacle-list { max-height: 200px; overflow-y: auto; font-size: 12px; }
  .obs-item {
    background: #1a1a2e; padding: 6px 8px; margin-bottom: 4px; border-radius: 4px;
    display: flex; justify-content: space-between; align-items: center; cursor: pointer;
  }
  .obs-item:hover { background: #2a2a4e; }
  .obs-item.selected { border: 1px solid #e94560; }
  .obs-item .del-btn { background: #a03030; color: #fff; border: none; border-radius: 3px; padding: 2px 6px; cursor: pointer; }

  #canvas-wrap { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }
  canvas { background: #0a0a1a; border-radius: 8px; cursor: crosshair; }

  #status { position: fixed; bottom: 12px; left: 300px; color: #aaa; font-size: 13px; }
  #coords { position: fixed; bottom: 12px; right: 20px; color: #aaa; font-size: 13px; }
</style>
</head>
<body>

<div id="sidebar">
  <h2>2D Map Editor</h2>

  <div class="section">
    <h3>Bounds</h3>
    <div class="row">
      <label>Lower X:</label><input type="number" id="lx" value="0" step="0.5">
      <label>Y:</label><input type="number" id="ly" value="0" step="0.5">
    </div>
    <div class="row">
      <label>Upper X:</label><input type="number" id="ux" value="10" step="0.5">
      <label>Y:</label><input type="number" id="uy" value="10" step="0.5">
    </div>
    <button class="btn-action" onclick="applyBounds()">Apply Bounds</button>
  </div>

  <div class="section">
    <h3>Mode</h3>
    <button class="btn-mode active" id="btn-obs" onclick="setMode('obstacle')">Draw Obstacle</button>
    <button class="btn-mode" id="btn-start" onclick="setMode('start')" style="margin-top:4px">Place Start</button>
    <button class="btn-mode" id="btn-goal" onclick="setMode('goal')" style="margin-top:4px">Place Goal</button>
  </div>

  <div class="section">
    <h3>Obstacle Drawing</h3>
    <p style="font-size:12px;color:#aaa;margin-bottom:6px">Click to add vertices. Press <b>Enter</b> or button below to finish.</p>
    <button class="btn-action" onclick="finishObstacle()">Finish Obstacle</button>
    <button class="btn-danger" onclick="cancelObstacle()" style="margin-top:4px">Cancel Current</button>
  </div>

  <div class="section">
    <h3>Obstacles</h3>
    <div id="obstacle-list"></div>
    <button class="btn-danger" onclick="deleteSelected()" style="margin-top:6px">Delete Selected</button>
    <button class="btn-danger" onclick="clearAll()" style="margin-top:4px">Clear All</button>
  </div>

  <div class="section">
    <h3>Snap</h3>
    <div class="row">
      <label>Grid Snap:</label>
      <input type="number" id="snap-val" value="0.5" step="0.1" min="0" style="width:50px">
    </div>
  </div>

  <div class="section">
    <button class="btn-export" onclick="exportJSON()">Export JSON</button>
    <button class="btn-action" onclick="importJSON()" style="margin-top:4px">Import JSON</button>
    <input type="file" id="file-input" accept=".json" style="display:none" onchange="loadFile(event)">
  </div>
</div>

<div id="canvas-wrap">
  <canvas id="canvas" width="700" height="700"></canvas>
</div>

<div id="status">Mode: Draw Obstacle</div>
<div id="coords"></div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let bounds = { lower: [0, 0], upper: [10, 10] };
let obstacles = [];
let start = null;
let goal = null;
let mode = 'obstacle'; // 'obstacle', 'start', 'goal'
let currentPoly = [];
let selectedObs = -1;
let hoverPos = null;

const PADDING = 40;

function worldToCanvas(wx, wy) {
  const bw = bounds.upper[0] - bounds.lower[0];
  const bh = bounds.upper[1] - bounds.lower[1];
  const cw = canvas.width - 2 * PADDING;
  const ch = canvas.height - 2 * PADDING;
  const scale = Math.min(cw / bw, ch / bh);
  const ox = PADDING + (cw - bw * scale) / 2;
  const oy = PADDING + (ch - bh * scale) / 2;
  return [ox + (wx - bounds.lower[0]) * scale, oy + (bounds.upper[1] - wy) * scale];
}

function canvasToWorld(cx, cy) {
  const bw = bounds.upper[0] - bounds.lower[0];
  const bh = bounds.upper[1] - bounds.lower[1];
  const cw = canvas.width - 2 * PADDING;
  const ch = canvas.height - 2 * PADDING;
  const scale = Math.min(cw / bw, ch / bh);
  const ox = PADDING + (cw - bw * scale) / 2;
  const oy = PADDING + (ch - bh * scale) / 2;
  let wx = (cx - ox) / scale + bounds.lower[0];
  let wy = bounds.upper[1] - (cy - oy) / scale;
  return [wx, wy];
}

function snap(val) {
  const s = parseFloat(document.getElementById('snap-val').value) || 0;
  if (s <= 0) return Math.round(val * 100) / 100;
  return Math.round(val / s) * s;
}

function snapPoint(wx, wy) {
  return [snap(wx), snap(wy)];
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // grid
  const bw = bounds.upper[0] - bounds.lower[0];
  const bh = bounds.upper[1] - bounds.lower[1];
  const gridStep = Math.max(0.5, Math.round(Math.max(bw, bh) / 20 * 2) / 2);

  ctx.strokeStyle = '#1a1a3e';
  ctx.lineWidth = 0.5;
  for (let x = bounds.lower[0]; x <= bounds.upper[0]; x += gridStep) {
    const [cx1, cy1] = worldToCanvas(x, bounds.lower[1]);
    const [cx2, cy2] = worldToCanvas(x, bounds.upper[1]);
    ctx.beginPath(); ctx.moveTo(cx1, cy1); ctx.lineTo(cx2, cy2); ctx.stroke();
  }
  for (let y = bounds.lower[1]; y <= bounds.upper[1]; y += gridStep) {
    const [cx1, cy1] = worldToCanvas(bounds.lower[0], y);
    const [cx2, cy2] = worldToCanvas(bounds.upper[0], y);
    ctx.beginPath(); ctx.moveTo(cx1, cy1); ctx.lineTo(cx2, cy2); ctx.stroke();
  }

  // bounds
  const [bx1, by1] = worldToCanvas(bounds.lower[0], bounds.lower[1]);
  const [bx2, by2] = worldToCanvas(bounds.upper[0], bounds.upper[1]);
  ctx.strokeStyle = '#e94560';
  ctx.lineWidth = 2;
  ctx.strokeRect(bx2 < bx1 ? bx2 : bx1, by2 < by1 ? by2 : by1, Math.abs(bx2 - bx1), Math.abs(by2 - by1));

  // axis labels
  ctx.fillStyle = '#666';
  ctx.font = '11px Arial';
  ctx.textAlign = 'center';
  for (let x = Math.ceil(bounds.lower[0]); x <= bounds.upper[0]; x += gridStep) {
    const [cx, cy] = worldToCanvas(x, bounds.lower[1]);
    ctx.fillText(x.toFixed(1), cx, cy + 16);
  }
  ctx.textAlign = 'right';
  for (let y = Math.ceil(bounds.lower[1]); y <= bounds.upper[1]; y += gridStep) {
    const [cx, cy] = worldToCanvas(bounds.lower[0], y);
    ctx.fillText(y.toFixed(1), cx - 8, cy + 4);
  }

  // obstacles
  obstacles.forEach((obs, i) => {
    if (obs.length < 2) return;
    ctx.beginPath();
    const [sx, sy] = worldToCanvas(obs[0][0], obs[0][1]);
    ctx.moveTo(sx, sy);
    for (let j = 1; j < obs.length; j++) {
      const [px, py] = worldToCanvas(obs[j][0], obs[j][1]);
      ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = i === selectedObs ? 'rgba(233,69,96,0.4)' : 'rgba(83,52,131,0.5)';
    ctx.fill();
    ctx.strokeStyle = i === selectedObs ? '#e94560' : '#7b5ea7';
    ctx.lineWidth = 2;
    ctx.stroke();

    // vertices
    obs.forEach(v => {
      const [vx, vy] = worldToCanvas(v[0], v[1]);
      ctx.beginPath();
      ctx.arc(vx, vy, 4, 0, Math.PI * 2);
      ctx.fillStyle = '#e94560';
      ctx.fill();
    });
  });

  // current polygon being drawn
  if (currentPoly.length > 0) {
    ctx.beginPath();
    const [sx, sy] = worldToCanvas(currentPoly[0][0], currentPoly[0][1]);
    ctx.moveTo(sx, sy);
    for (let j = 1; j < currentPoly.length; j++) {
      const [px, py] = worldToCanvas(currentPoly[j][0], currentPoly[j][1]);
      ctx.lineTo(px, py);
    }
    // draw line to hover
    if (hoverPos) {
      const [hx, hy] = worldToCanvas(hoverPos[0], hoverPos[1]);
      ctx.lineTo(hx, hy);
    }
    ctx.strokeStyle = '#1b998b';
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 5]);
    ctx.stroke();
    ctx.setLineDash([]);

    currentPoly.forEach(v => {
      const [vx, vy] = worldToCanvas(v[0], v[1]);
      ctx.beginPath();
      ctx.arc(vx, vy, 5, 0, Math.PI * 2);
      ctx.fillStyle = '#1b998b';
      ctx.fill();
    });
  }

  // start
  if (start) {
    const [sx, sy] = worldToCanvas(start[0], start[1]);
    ctx.beginPath();
    ctx.arc(sx, sy, 8, 0, Math.PI * 2);
    ctx.fillStyle = '#2ecc71';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 10px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('S', sx, sy + 4);
  }

  // goal
  if (goal) {
    const [gx, gy] = worldToCanvas(goal[0], goal[1]);
    ctx.beginPath();
    ctx.arc(gx, gy, 8, 0, Math.PI * 2);
    ctx.fillStyle = '#e74c3c';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 10px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('G', gx, gy + 4);
  }
}

function updateObstacleList() {
  const list = document.getElementById('obstacle-list');
  list.innerHTML = '';
  obstacles.forEach((obs, i) => {
    const div = document.createElement('div');
    div.className = 'obs-item' + (i === selectedObs ? ' selected' : '');
    div.innerHTML = `<span>Obs ${i + 1} (${obs.length} verts)</span><button class="del-btn" onclick="event.stopPropagation();deleteObs(${i})">X</button>`;
    div.onclick = () => { selectedObs = selectedObs === i ? -1 : i; updateObstacleList(); draw(); };
    list.appendChild(div);
  });
}

function setMode(m) {
  mode = m;
  document.getElementById('btn-obs').classList.toggle('active', m === 'obstacle');
  document.getElementById('btn-start').classList.toggle('active', m === 'start');
  document.getElementById('btn-goal').classList.toggle('active', m === 'goal');
  const labels = { obstacle: 'Draw Obstacle', start: 'Place Start', goal: 'Place Goal' };
  document.getElementById('status').textContent = 'Mode: ' + labels[m];
}

function applyBounds() {
  bounds.lower = [parseFloat(document.getElementById('lx').value), parseFloat(document.getElementById('ly').value)];
  bounds.upper = [parseFloat(document.getElementById('ux').value), parseFloat(document.getElementById('uy').value)];
  draw();
}

function convexHull(points) {
  if (points.length <= 3) return points;
  points = points.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cross = (O, A, B) => (A[0] - O[0]) * (B[1] - O[1]) - (A[1] - O[1]) * (B[0] - O[0]);
  const lower = [];
  for (const p of points) { while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop(); lower.push(p); }
  const upper = [];
  for (const p of points.reverse()) { while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop(); upper.push(p); }
  return lower.slice(0, -1).concat(upper.slice(0, -1));
}

function finishObstacle() {
  if (currentPoly.length < 3) { alert('Need at least 3 vertices!'); return; }
  const hull = convexHull(currentPoly);
  obstacles.push(hull);
  currentPoly = [];
  selectedObs = obstacles.length - 1;
  updateObstacleList();
  draw();
}

function cancelObstacle() {
  currentPoly = [];
  draw();
}

function deleteObs(i) {
  obstacles.splice(i, 1);
  if (selectedObs >= obstacles.length) selectedObs = -1;
  updateObstacleList();
  draw();
}

function deleteSelected() {
  if (selectedObs >= 0) { deleteObs(selectedObs); selectedObs = -1; }
}

function clearAll() {
  obstacles = []; currentPoly = []; start = null; goal = null; selectedObs = -1;
  updateObstacleList(); draw();
}

function exportJSON() {
  const data = {
    lower: bounds.lower.map(v => parseFloat(v.toFixed(2))),
    upper: bounds.upper.map(v => parseFloat(v.toFixed(2))),
    obstacles: obstacles.map(obs => obs.map(v => [parseFloat(v[0].toFixed(2)), parseFloat(v[1].toFixed(2))])),
    start: start ? start.map(v => parseFloat(v.toFixed(2))) : null,
    goal: goal ? goal.map(v => parseFloat(v.toFixed(2))) : null
  };
  const json = JSON.stringify(data, null, 4);
  const blob = new Blob([json], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'map.json';
  a.click();
}

function importJSON() {
  document.getElementById('file-input').click();
}

function loadFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const data = JSON.parse(ev.target.result);
      bounds.lower = data.lower || [0, 0];
      bounds.upper = data.upper || [10, 10];
      obstacles = data.obstacles || [];
      start = data.start || null;
      goal = data.goal || null;
      document.getElementById('lx').value = bounds.lower[0];
      document.getElementById('ly').value = bounds.lower[1];
      document.getElementById('ux').value = bounds.upper[0];
      document.getElementById('uy').value = bounds.upper[1];
      currentPoly = [];
      selectedObs = -1;
      updateObstacleList();
      draw();
    } catch (err) { alert('Invalid JSON: ' + err.message); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

// Canvas events
canvas.addEventListener('click', function(e) {
  const rect = canvas.getBoundingClientRect();
  const [wx, wy] = canvasToWorld(e.clientX - rect.left, e.clientY - rect.top);
  const [sx, sy] = snapPoint(wx, wy);

  if (mode === 'obstacle') {
    currentPoly.push([sx, sy]);
    draw();
  } else if (mode === 'start') {
    start = [sx, sy];
    draw();
  } else if (mode === 'goal') {
    goal = [sx, sy];
    draw();
  }
});

canvas.addEventListener('mousemove', function(e) {
  const rect = canvas.getBoundingClientRect();
  const [wx, wy] = canvasToWorld(e.clientX - rect.left, e.clientY - rect.top);
  const [sx, sy] = snapPoint(wx, wy);
  hoverPos = [sx, sy];
  document.getElementById('coords').textContent = `(${sx.toFixed(2)}, ${sy.toFixed(2)})`;
  if (currentPoly.length > 0) draw();
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && mode === 'obstacle' && currentPoly.length >= 3) {
    finishObstacle();
  } else if (e.key === 'Escape') {
    cancelObstacle();
  } else if (e.key === 'Delete' && selectedObs >= 0) {
    deleteSelected();
  }
});

// Resize canvas
function resizeCanvas() {
  const wrap = document.getElementById('canvas-wrap');
  const size = Math.min(wrap.clientWidth - 40, wrap.clientHeight - 40, 900);
  canvas.width = size;
  canvas.height = size;
  draw();
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

draw();
</script>
</body>
</html>
